name: CI/CD Pipeline for CSC325 Django Project

On:
  Push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: 
        python -m pip install django

    - name: Run tests
      run:
        python manage.py test

    - name: Deploy
      run: 
        echo "Deploying the application..."
